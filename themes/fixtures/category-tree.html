<!-- categoryTree — nested lists, one level per taxonomy depth.
     aria-current="true" marks the selected node on every level of the open path.
     Each href filters on the node's own tag code name: the server rolls counts up, so one
     value selects the whole subtree (contract: FacetValue.path). -->

<nav class="xps xps-category-tree" aria-label="Categories">
  <h3 class="xps-category-tree__title">Categories</h3>
  <ul class="xps-category-tree__list xps-category-tree__list--lvl0">
    <li class="xps-category-tree__item xps-category-tree__item--parent xps-category-tree__item--selected">
      <a class="xps-category-tree__link" href="?category=coffee" aria-current="true">
        <span class="xps-category-tree__value">Coffee</span>
        <span class="xps-category-tree__count">42</span>
      </a>
      <ul class="xps-category-tree__list xps-category-tree__list--lvl1">
        <li class="xps-category-tree__item xps-category-tree__item--parent xps-category-tree__item--selected">
          <a class="xps-category-tree__link" href="?category=machines" aria-current="true">
            <span class="xps-category-tree__value">Machines</span>
            <span class="xps-category-tree__count">18</span>
          </a>
          <ul class="xps-category-tree__list xps-category-tree__list--lvl2">
            <li class="xps-category-tree__item">
              <a class="xps-category-tree__link" href="?category=espresso">
                <span class="xps-category-tree__value">Espresso</span>
                <span class="xps-category-tree__count">11</span>
              </a>
            </li>
            <li class="xps-category-tree__item">
              <a class="xps-category-tree__link" href="?category=filter">
                <span class="xps-category-tree__value">Filter</span>
                <span class="xps-category-tree__count">7</span>
              </a>
            </li>
          </ul>
        </li>
        <li class="xps-category-tree__item">
          <a class="xps-category-tree__link" href="?category=grinders">
            <span class="xps-category-tree__value">Grinders</span>
            <span class="xps-category-tree__count">24</span>
          </a>
        </li>
      </ul>
    </li>
    <li class="xps-category-tree__item">
      <a class="xps-category-tree__link" href="?category=tea">
        <span class="xps-category-tree__value">Tea</span>
        <span class="xps-category-tree__count">9</span>
      </a>
    </li>
    <li class="xps-category-tree__item xps-category-tree__item--disabled">
      <span class="xps-category-tree__link" aria-disabled="true">
        <span class="xps-category-tree__value">Accessories</span>
        <span class="xps-category-tree__count">0</span>
      </span>
    </li>
  </ul>
</nav>
