<!-- currentRefinements — removable chips, one per active refinement value -->

<div class="xps xps-current-refinements">
  <h3 class="xps-current-refinements__title xps-sr-only" id="xps-search-1-current-refinements-title">Active filters</h3>
  <ul class="xps-current-refinements__list" aria-labelledby="xps-search-1-current-refinements-title">
    <li class="xps-current-refinements__item">
      <span class="xps-chip">
        <span class="xps-chip__label"><span class="xps-chip__attribute">Content type</span> Article</span>
        <button class="xps-chip__remove" type="button" aria-label="Remove filter Content type: Article">
          <span aria-hidden="true">&times;</span>
        </button>
      </span>
    </li>
    <li class="xps-current-refinements__item">
      <span class="xps-chip">
        <span class="xps-chip__label"><span class="xps-chip__attribute">Tags</span> espresso</span>
        <button class="xps-chip__remove" type="button" aria-label="Remove filter Tags: espresso">
          <span aria-hidden="true">&times;</span>
        </button>
      </span>
    </li>
    <li class="xps-current-refinements__item">
      <span class="xps-chip">
        <span class="xps-chip__label"><span class="xps-chip__attribute">Price</span> 50 to 300</span>
        <button class="xps-chip__remove" type="button" aria-label="Remove filter Price: 50 to 300">
          <span aria-hidden="true">&times;</span>
        </button>
      </span>
    </li>
  </ul>
</div>

<!-- nothing refined: the widget renders an empty list rather than disappearing, so layout is stable -->
<div class="xps xps-current-refinements xps-current-refinements--empty">
  <h3 class="xps-current-refinements__title xps-sr-only" id="xps-search-2-current-refinements-title">Active filters</h3>
  <ul class="xps-current-refinements__list" aria-labelledby="xps-search-2-current-refinements-title"></ul>
</div>
