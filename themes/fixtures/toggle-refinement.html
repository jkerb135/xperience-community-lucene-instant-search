<!-- toggleRefinement — a single boolean facet. A real checkbox, not a styled div. -->

<div class="xps xps-toggle-refinement">
  <label class="xps-toggle-refinement__label">
    <input class="xps-toggle-refinement__checkbox" type="checkbox" name="inStock" value="true" checked>
    <span class="xps-toggle-refinement__value">In stock only</span>
    <span class="xps-toggle-refinement__count">128</span>
  </label>
</div>

<div class="xps xps-toggle-refinement xps-toggle-refinement--disabled">
  <label class="xps-toggle-refinement__label">
    <input class="xps-toggle-refinement__checkbox" type="checkbox" name="onSale" value="true" disabled>
    <span class="xps-toggle-refinement__value">On sale</span>
    <span class="xps-toggle-refinement__count">0</span>
  </label>
</div>
