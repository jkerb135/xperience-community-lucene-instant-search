<!-- clearFilters — states: enabled (filters active), disabled (nothing to clear) -->

<div class="xps xps-clear-filters">
  <button class="xps-button xps-button--link xps-clear-filters__button" type="button">Clear all</button>
</div>

<div class="xps xps-clear-filters xps-clear-filters--disabled">
  <button class="xps-button xps-button--link xps-clear-filters__button" type="button" disabled>Clear all</button>
</div>
