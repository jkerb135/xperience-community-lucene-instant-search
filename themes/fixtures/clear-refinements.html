<!-- clearRefinements — states: enabled (filters active), disabled (nothing to clear) -->

<div class="xps xps-clear-refinements">
  <button class="xps-button xps-clear-refinements__button" type="button">Clear filters</button>
</div>

<div class="xps xps-clear-refinements xps-clear-refinements--disabled">
  <button class="xps-button xps-clear-refinements__button" type="button" disabled>Clear filters</button>
</div>
