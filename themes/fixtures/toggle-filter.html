<!-- toggleFilter — a single boolean facet. A real checkbox, not a styled div. -->

<div class="xps xps-toggle-filter">
  <label class="xps-toggle-filter__label">
    <input class="xps-toggle-filter__checkbox" type="checkbox" name="inStock" value="true" checked>
    <span class="xps-toggle-filter__value">In stock only</span>
    <span class="xps-toggle-filter__count">128</span>
  </label>
</div>

<div class="xps xps-toggle-filter xps-toggle-filter--disabled">
  <label class="xps-toggle-filter__label">
    <input class="xps-toggle-filter__checkbox" type="checkbox" name="onSale" value="true" disabled>
    <span class="xps-toggle-filter__value">On sale</span>
    <span class="xps-toggle-filter__count">0</span>
  </label>
</div>
