<!-- xps-sidebar — the filter column as a composition class, not a widget: the host puts it on the
     element that holds its refinement mounts (docs/guides/page-builder-widgets.md, "Composing the
     results page"). It carries `xps` itself, so the theme paints it as the design board's card:
     surface, border, radius, padding and a soft shadow around whatever the host stacked inside. -->

<div class="xps xps-sidebar">
  <div class="xps-sidebar__header">
    <h2 class="xps-sidebar__title">Filters</h2>
    <div class="xps xps-clear-filters">
      <button class="xps-button xps-button--link xps-clear-filters__button" type="button">Clear all</button>
    </div>
  </div>

  <div class="xps xps-facet-list">
    <h3 class="xps-facet-list__title" id="xps-search-9-content-type-title">
      <button class="xps-facet-list__toggle" type="button" aria-expanded="true" aria-controls="xps-search-9-content-type-body">
        <span class="xps-facet-list__toggle-label">Content type</span>
        <svg class="xps-facet-list__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
    </h3>
    <div class="xps-facet-list__body" id="xps-search-9-content-type-body">
      <ul class="xps-facet-list__list" aria-labelledby="xps-search-9-content-type-title">
        <li class="xps-facet-list__item">
          <label class="xps-facet-list__label">
            <input class="xps-facet-list__checkbox" type="checkbox" name="contentType" value="Product">
            <span class="xps-facet-list__value">Product</span>
            <span class="xps-facet-list__count">8</span>
          </label>
        </li>
        <li class="xps-facet-list__item">
          <label class="xps-facet-list__label">
            <input class="xps-facet-list__checkbox" type="checkbox" name="contentType" value="Article">
            <span class="xps-facet-list__value">Article</span>
            <span class="xps-facet-list__count">3</span>
          </label>
        </li>
      </ul>
    </div>
  </div>

  <div class="xps xps-facet-list">
    <h3 class="xps-facet-list__title" id="xps-search-9-tags-title">
      <button class="xps-facet-list__toggle" type="button" aria-expanded="true" aria-controls="xps-search-9-tags-body">
        <span class="xps-facet-list__toggle-label">Tags</span>
        <svg class="xps-facet-list__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
    </h3>
    <div class="xps-facet-list__body" id="xps-search-9-tags-body">
      <ul class="xps-facet-list__list" aria-labelledby="xps-search-9-tags-title">
        <li class="xps-facet-list__item xps-facet-list__item--selected">
          <label class="xps-facet-list__label">
            <input class="xps-facet-list__checkbox" type="checkbox" name="tags" value="Espresso" checked>
            <span class="xps-facet-list__value">Espresso</span>
            <span class="xps-facet-list__count">5</span>
          </label>
        </li>
        <li class="xps-facet-list__item">
          <label class="xps-facet-list__label">
            <input class="xps-facet-list__checkbox" type="checkbox" name="tags" value="Filter">
            <span class="xps-facet-list__value">Filter</span>
            <span class="xps-facet-list__count">2</span>
          </label>
        </li>
      </ul>
    </div>
  </div>
</div>
