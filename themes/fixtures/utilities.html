<!-- Shell utilities available to custom widgets (spec 5.7). Nothing here is widget-specific:
     a custom behaviour renderer can reach for these and inherit accessible defaults. -->

<div class="xps xps-stack">
  <h3>Custom widget: recently viewed</h3>

  <!-- .xps-cluster: inline row that wraps, gap = --xps-space -->
  <div class="xps-cluster">
    <button class="xps-button" type="button">Apply</button>
    <button class="xps-button xps-button--primary" type="button">Apply</button>
    <button class="xps-button" type="button" disabled>Unavailable</button>
    <span class="xps-chip">
      <span class="xps-chip__label">Espresso</span>
      <button class="xps-chip__remove" type="button" aria-label="Remove filter Espresso">
        <span aria-hidden="true">&times;</span>
      </button>
    </span>
  </div>

  <!-- .xps-skeleton: structural placeholder, currentColor at low opacity -->
  <div class="xps-stack">
    <span class="xps-skeleton xps-skeleton--title"></span>
    <span class="xps-skeleton xps-skeleton--text"></span>
    <span class="xps-skeleton xps-skeleton--block"></span>
  </div>

  <!-- .xps-sr-only: visible to assistive technology only -->
  <p><span class="xps-sr-only">Announced but not shown.</span>Highlighted term: <mark class="xps-highlight">espresso</mark>.</p>
</div>
