<!-- Page Builder mount point (spec 7.1). The bootstrap renders the widget inside it;
     nothing is styled on .xps-mount, so an empty or failed mount never disturbs the page. -->

<div class="xps-mount"
     data-xps-widget="facetList"
     data-xps-instance="search-1"
     data-xps-config='{"attribute":"contentType","limit":10,"showMore":true}'></div>
